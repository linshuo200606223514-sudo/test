{% extends "base.html" %}

{% block title %}{{ video.title }} - 汕头市澄海区溪南东社造纸厂开放学习平台{% endblock %}

{% block extra_css %}
<style>
    .video-container {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 比例 */
        height: 0;
        overflow: hidden;
        background-color: #000;
    }
    .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('index') }}">首页</a></li>
            <li class="breadcrumb-item active">视频播放</li>
        </ol>
    </nav>

    <h2 class="mb-4">{{ video.title }}</h2>

    <!-- 视频播放区域 -->
    <div class="video-container mb-4">
        <iframe src="{{ embed_url }}"
                scrolling="no"
                border="0"
                frameborder="no"
                framespacing="0"
                allowfullscreen="true"
                sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts">
        </iframe>
    </div>

    <!-- 视频介绍 -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">视频介绍</h5>
        </div>
        <div class="card-body">
            {% if video.description %}
                <p class="card-text" style="white-space: pre-wrap;">{{ video.description }}</p>
            {% else %}
                <p class="text-muted">暂无介绍</p>
            {% endif %}
        </div>
    </div>

    <div class="mt-3">
        <a href="javascript:history.back()" class="btn btn-secondary">返回</a>
    </div>
</div>
{% endblock %}
